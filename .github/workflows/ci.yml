name: CI

on:
  pull_request:
    paths:
      - 'astro/**'
      - '.github/workflows/**'

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: astro/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: astro

      - name: Build Astro
        run: npm run build
        working-directory: astro
